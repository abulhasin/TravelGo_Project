<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Navbar -->

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">TravelGo</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="login.html"> Login / Sign Up </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="about.html"> About / Contact </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Login Section -->

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow p-4">
          <h2 class="text-center mb-4">Login</h2>

          <!-- login form Js Used from here -->
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label"> Email </label>

              <input type="email" class="form-control" id="loginEmail" required />
            </div>

            <div class="mb-3">
              <label class="form-label"> Password </label>

              <input type="password" class="form-control" id="loginPassword" required />
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <hr />

          <p class="text-center">Don't have an account?</p>

          <!-- first Js Used -->

          <button class="btn btn-success w-100" onclick="showSignup()">
            Create Account
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sign Up -->

  <div class="container mb-5" id="signupSection" style="display: none">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow p-4">
          <h2 class="text-center mb-4">Sign Up</h2>

          <form id="signupForm">
            <div class="mb-3">
              <label>Name</label>

              <input type="text" class="form-control" id="name" required />
            </div>

            <div class="mb-3">
              <label>Email</label>

              <input type="email" class="form-control" id="email" required />
            </div>

            <div class="mb-3">
              <label>Password</label>

              <input type="password" class="form-control" id="password" required />
            </div>

            <div class="mb-3">
              <label>Confirm Password</label>

              <input type="password" class="form-control" id="confirmPassword" required />
            </div>

            <button type="submit" class="btn btn-success w-100">
              Register
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- Footer section -->
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 TravelGo. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>

</html>
